value: Windows AppContainer uses a stable SHA-256-derived identity per canonical workspace, with zero capabilities, workspace grants, permitted toolchain reads, separate scratch HOME, and existing suspended Job Object launch. Scopes on one workspace reuse their identity. Host-owned per-identity grant records under LOCALAPPDATA/fastllm/sandbox-grants use a cross-process lock shared across identities. Revocation includes new identities and the unused legacy shared identity. Workspace drive mappings remain scope-owned.
reason: User requested fixing the reproduced cross-workspace sandbox read. Per-workspace identities isolate unrelated trees while reusing expensive grants; one global identity leaks across workspaces, and per-run identities repeatedly rewrite large toolchain ACLs. Do not case-fold identity input because Windows supports case-sensitive directories.
