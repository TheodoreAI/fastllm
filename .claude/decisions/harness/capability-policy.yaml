value: policyForRequest is now a view of monitor.decideTool; capabilities/network_policy only narrow the mode table. Empty or unknown mode fails closed to plan, so headless -task and HTTP runs without a mode cannot mutate (-mode / permission_mode opt in). Child of agent runs as plan. Shell still requires write+network. then_run is stripped from mutation schemas wherever run_command is denied.
reason: Single reference monitor with fail-closed defaults; previous empty-mode headless runs were effectively full access.
