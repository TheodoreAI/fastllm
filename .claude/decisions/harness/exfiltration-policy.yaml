value: Secret reads always ask and mark shared SessionTaint; search resolves and bounds target paths, skips both named and canonical secret files, and opens within os.Root. TUI and REPL persist secret_sources with messages and restore taint on resume. A missing/null field on a nonempty legacy conversation is conservatively tainted; an empty array is known-clean. New or cleared conversations discard taint; outbound web tools require exact-request consent while tainted.
reason: User requested fixing search alias leakage and resume losing exfiltration protection. Persisted metadata survives transcript compaction; inferring solely from surviving tool calls misses secret summaries. Conservative legacy handling wins over silently assuming old conversations are clean.
