value: Monitor invariant I10: read_file of a secret path (isSecretPath on canonical path; .env templates exempt) asks in every mode (ConsentRequest.Always) and is refused headless; search_files skips secret files; an approved secret read marks a SessionTaint shared with child agents and, in the TUI/REPL, with every turn until /new, /clear or resume; while tainted, web_fetch/web_search ask in every mode with scopeExact grants (one exact request). Legacy PermissionController still refuses non-Always asks outside agent mode
reason: Kernel gap #5: agent/edit/full allowed web tools unasked, so read .env then fetch ?k=<secret> exfiltrated silently. Taint on secret reads (not every read) stops that without prompting on every fetch; shell exfiltration is left to the sandbox
