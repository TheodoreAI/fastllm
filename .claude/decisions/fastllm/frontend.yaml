value: One binary, cmd/server: no arguments launches the terminal UI, the 'server' subcommand runs the headless HTTP backend (/api/* and /v1/*, plain-text notice at /, 404 elsewhere). The React/Vite frontend in web/ and the duplicate cmd/cli binary are both deleted.
reason: The TUI reached parity and recent work all targeted it, so maintaining two UIs duplicated effort. Removal was gated on the stranded-data checklist rather than done outright: conversations lived only in SQLite, so an idempotent import (--import-conversations, plus /conversations and /import in the TUI) was built and verified against the real 22MB fastllm.db before deleting anything. Notes had 0 rows and were unwanted; cloud_providers had no row at all and config.json is already the real source for the TUI. cmd/cli was dropped because cmd/server already dispatches to the same TUI and was a strict superset for 1.2MB (18.7 vs 19.9MB) -- and the split had already caused a real defect, where the legacystore opener was wired into cmd/cli only, leaving the installed binary unable to import. Wire any TUI-facing dependency in cmd/server. The HTTP API/compat backend is deliberately NOT removed -- retiring the frontend is a separate decision from retiring the server.
decided_at: 2026-09-20T17:05:04+00:00
