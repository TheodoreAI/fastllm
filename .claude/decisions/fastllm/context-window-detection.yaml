value: A model's context window comes from, in order: config context_window; the provider, asked only on /models detect [id|all] or right after /models add (Anthropic Models API max_input_tokens, Gemini inputTokenLimit via x-goog-api-key, Ollama /api/show num_ctx and an error rather than a guess when unpinned, vLLM/OpenAI-compatible /models max_model_len|context_length; OpenAI reports none) and saved as context_window; then the built-in table (whole-segment keys, input limits, cited sources); then 32k. A provider's context-overflow error (typed llm.ContextOverflowError) makes a run adopt the stated window, force-compact with fewer kept messages until it fits, and retry once; the learned window is held for the session but never written to config automatically.
reason: /models add saved no window, so cloud models were guessed from a stale table: gpt-4.1 matched gpt-4 (8k), GPT-5/o4/Gemini fell to 32k, every Claude to 200k (current ones are 1M). An overflow ended the run outright. Startup still never probes (tunnels are often down), keeping context-budget's no-network rule. Live checks: all three Ollama aliases detected their exact num_ctx and the Gemini API returned 1,048,576.
decided_at: 2026-09-25T04:34:06+00:00
