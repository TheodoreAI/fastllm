value: list_files/search_files/glob_files go through workspaceFiles (internal/harness/ignore.go): in git, tracked files always shown, untracked filtered by .gitignore plus a default dir list (.venv, node_modules, __pycache__, target, ...); outside git, a walk honouring nested .gitignore files plus the default list; .fastllmignore (gitignore syntax, root only, additive) applies in both; search skips binary (NUL in first 8000 bytes). read_file is not filtered.
reason: Non-git workspaces had only a 4-name skip list, so .venv etc. flooded listings capped at 200 entries. Default list is not applied to tracked files so committed source in folders like build/ stays visible. .fastllmignore only hides files, so it is not gated by workspace trust.
