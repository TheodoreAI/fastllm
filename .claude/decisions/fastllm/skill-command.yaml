value: Discover project and global skills from .agents, .claude, .codex, .opencode, OpenCode config, and legacy AGY .agent sources; project and nearer definitions override global ones. /skills and /skills list enumerate skills, /skills NAME shows details, /skills NAME TASK applies instructions for one run, and compact catalog metadata is advertised to the model.
reason: Broader cross-agent compatibility and model-visible discovery were explicitly requested; compact metadata limits context cost, while one-run body injection and project precedence retain the safety benefits of the previous project-local design.
decided_at: 2026-09-22T03:32:24+00:00
