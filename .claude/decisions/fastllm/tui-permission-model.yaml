value: Three session-scoped modes for model-initiated mutations: ask by default, read-only removes mutating tools, and auto permits autonomous execution. Ask supports once/session-tool/deny; grants are never persisted or restored.
reason: Ask is the safest usable default, read-only provides a hard capability boundary, and auto preserves unattended workflows; direct user-entered shell commands are already explicit authorization and do not reprompt.
decided_at: 2026-09-19T21:05:55+00:00
