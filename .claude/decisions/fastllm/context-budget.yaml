value: Size the transcript budget from the model's context window (endpoint context_window, then the model-ID table, then 32k): reserve an eighth of the window for the reply (1k-8k tokens), convert the rest at 3.3 chars/token, then subtract the JSON size of the tool schemas actually sent (8k-char floor). Bound every tool result at insertion to a quarter of that budget (min 4k chars, head+tail with an omission notice), clip each search match line to 300 chars around the match, and after compaction halve the largest tool results, current turn included, until the request fits.
reason: A 16k Ollama model (Ornith 1.5) rejected an 80,956-token request: one search_files result was 209,997 chars because matching lines in minified files were unbounded, and compaction never shortens the current turn. Measured on that model: system prompt 3,884 tokens (4.35 c/t), 12 tool schemas 1,732 tokens (3.37 c/t) that the old budget never counted, Go source 3.65 c/t; the old flat 75% at 4 c/t left no room. Replaying the failed session: before, rejected at 80,956 tokens; after, accepted at 12,822 tokens with 3,562 left for the reply.
